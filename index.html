<style>
:root{--orange:#E8843C;--orange-d:#C9661F;--green:#5FB88E;--green-d:#3F9A6F;--green-band:#4FA87C;
 --green-tape:rgba(95,184,142,.5);--tan-tape:rgba(196,150,96,.45);--amber:#E8A33C;
 --cream:#ECE7DB;--paper:#FBF9F2;--ink:#2C2C2C;--ink-soft:#5b5750;--shadow:0 6px 18px rgba(60,50,30,.12)}
.m-eki{--mc:#E8843C;--mcd:#C9661F;--mtext:#fff}.m-meili{--mc:#EC8E78;--mcd:#CE6A55;--mtext:#fff}
.m-duo{--mc:#F4A92E;--mcd:#CE8810;--mtext:#fff}.m-anan{--mc:#B9C2C7;--mcd:#8A969C;--mtext:#3A4248}
.m-east{--mc:#3690B4;--mcd:#256E8E;--mtext:#fff}.m-shude{--mc:#5FB88E;--mcd:#3F9A6F;--mtext:#fff}
.m-metro{--mc:#9A6B4B;--mcd:#724E36;--mtext:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}
body{font-family:"Noto Sans TC","PingFang TC","PingFang SC","Microsoft JhengHei","微軟正黑體","Heiti TC","Helvetica Neue",Arial,sans-serif;color:var(--ink);
 background-color:var(--cream);background-image:linear-gradient(rgba(120,110,90,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,110,90,.05) 1px,transparent 1px);background-size:26px 26px;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 18% 8%,rgba(255,255,255,.5),transparent 40%),radial-gradient(circle at 85% 92%,rgba(232,132,60,.06),transparent 45%)}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 20px 70px}
.sticker{position:absolute;pointer-events:none;z-index:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18))}
.gutter{position:fixed;z-index:0;opacity:.92;pointer-events:none;display:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.16))}
@media(min-width:1400px){.gutter{display:block}}
.g-left{left:18px;top:300px;width:78px;transform:rotate(-10deg)}.g-right{right:84px;top:120px;width:70px;transform:rotate(9deg)}
.g-left2{left:24px;top:640px;width:64px;transform:rotate(8deg)}.g-right2{right:90px;top:470px;width:58px;transform:rotate(-8deg)}
.hero{position:relative;margin:16px 0 8px;padding:30px 26px 28px;border-radius:18px;background:var(--paper);box-shadow:var(--shadow);overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;border-radius:18px;background:linear-gradient(rgba(120,110,90,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(120,110,90,.045) 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
.tape{position:absolute;border-radius:2px;z-index:1}
.tape.t1{top:-10px;left:40px;width:96px;height:30px;background:var(--green-tape);transform:rotate(-7deg)}
.tape.t2{top:20px;right:-18px;width:110px;height:28px;background:var(--tan-tape);transform:rotate(8deg)}
.brandlogo{position:relative;z-index:2;height:34px;display:block;margin:2px 0}
h1{position:relative;z-index:2;margin:18px 0 0;font-weight:900;font-size:clamp(34px,8vw,52px);line-height:1.04;letter-spacing:1px}
h1 .x{color:var(--orange);margin:0 4px}h1 .circle{position:relative;display:inline-block}
h1 .circle::after{content:"";position:absolute;left:-8px;right:-8px;top:-6px;bottom:-6px;border:3px solid var(--green);border-radius:50%;transform:rotate(-4deg);border-right-color:transparent}
.subtitle{position:relative;z-index:2;color:var(--ink-soft);font-size:14px;font-weight:500;margin-top:18px;line-height:1.7}.subtitle b{color:var(--orange);font-weight:700}
.hero .s-cat{top:-8px;right:18px;width:64px;transform:rotate(4deg)}
.hero .s-starg{top:78px;right:20px;width:30px;transform:rotate(12deg)}
.hero .s-donut{bottom:-10px;right:44px;width:48px;transform:rotate(-8deg)}
.searchbox{position:relative;margin:18px 0 4px;z-index:2}
.searchbox input{width:100%;border:2.5px solid var(--ink);border-radius:40px;padding:14px 18px 14px 46px;font-size:16px;font-family:inherit;background:var(--paper);color:var(--ink);outline:none;box-shadow:var(--shadow)}
.searchbox input::placeholder{color:#a7a096}.searchbox .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px}
.flabel{font-family:"Caveat","Noto Sans TC","PingFang TC","Microsoft JhengHei","微軟正黑體",sans-serif;font-size:21px;color:var(--ink-soft);margin:18px 0 11px;display:block;transform:rotate(-1.2deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0}
.chip{flex:0 0 auto;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:7px 14px;border-radius:30px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;transition:transform .12s;font-family:inherit}
.chip:active{transform:scale(.94)}.chip .n{font-weight:500;opacity:.55;font-size:12px;margin-left:3px}
.chip.on-mall{background:var(--mc);border-color:var(--mcd);color:var(--mtext)}.chip.on-cat{background:var(--ink);border-color:#000;color:#fff}
.chip.on-eki{background:var(--orange);border-color:var(--orange-d);color:#fff}
.chip.on-meili{background:#EC8E78;border-color:#CE6A55;color:#fff}
#zonewrap{border-left:4px solid var(--mc-zone,var(--orange));padding-left:12px;margin:4px 0 2px}
.count{font-size:13px;color:var(--ink-soft);margin:18px 0 12px;font-weight:500}.count b{color:var(--orange-d);font-size:16px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{position:relative;background:var(--paper);border-radius:14px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden;display:flex;min-height:128px;opacity:0;transform:translateY(14px);animation:pop .45s cubic-bezier(.2,.8,.3,1) forwards;animation-delay:calc(var(--i)*22ms);transition:transform .14s,box-shadow .14s}
.card:active{transform:scale(.985)}@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(60,50,30,.18)}}
@keyframes pop{to{opacity:1;transform:translateY(0)}}
.card .spine{flex:0 0 12px;background:var(--mc)}
.card .body{flex:1;padding:15px 16px 15px;position:relative;background-image:linear-gradient(rgba(120,110,90,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,110,90,.05) 1px,transparent 1px);background-size:18px 18px}
.tags{margin-bottom:8px;display:flex;gap:5px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--mtext);background:var(--mc);padding:3px 9px;border-radius:4px;transform:rotate(-1.4deg);letter-spacing:.3px}
.tag.alt{background:transparent;color:var(--mcd);border:1.6px solid var(--mc);transform:rotate(1.2deg)}
.tag.pop{background:linear-gradient(135deg,#F0468E,#F0872E);color:#fff;font-weight:800;transform:rotate(-2deg);box-shadow:0 2px 7px rgba(224,64,127,.4);letter-spacing:.3px}
.sheet .d-tag.pop{background:linear-gradient(135deg,#F0468E,#F0872E);color:#fff;font-weight:800}
.chip.pop-chip{background:linear-gradient(135deg,#F0468E,#F0872E);border-color:#C72E72;color:#fff;box-shadow:0 2px 9px rgba(224,64,127,.35)}
.chip.pop-chip.pop-on{outline:3px solid #8A1E52;outline-offset:1px}
.badge{float:right;font-size:11px;font-weight:700;padding:3px 9px;border-radius:30px;margin-top:1px}
.b-open{background:#e7f4ec;color:var(--green-d);border:1.5px solid var(--green)}
.b-soon{background:#fbf0df;color:#b9791b;border:1.5px solid var(--amber)}
.b-next{background:#eef1f5;color:#5d6b7a;border:1.5px solid #aeb8c4}
.b-appt{background:#f0ecf5;color:#7a6a90;border:1.5px solid #b3a6c6}
.card .name{font-weight:900;font-size:18px;line-height:1.22;margin:2px 0 9px;letter-spacing:.2px}
.card .meta{font-size:12.5px;color:var(--ink-soft);line-height:1.95;font-weight:500}.card .meta .ic{margin-right:5px}.card .loc2{font-weight:700;color:var(--mcd)}
.st{display:inline-block;font-weight:800;font-size:11.5px;padding:1px 9px;border-radius:6px;color:#fff;margin-left:5px;vertical-align:middle}
.st-n{background:#2E7CB8}.st-s{background:#E8843C}
.card .tape-c{position:absolute;top:-8px;right:14px;width:46px;height:18px;background:var(--green-tape);transform:rotate(9deg);border-radius:2px}
.empty{text-align:center;padding:46px 20px;color:var(--ink-soft)}.empty img{width:88px;margin-bottom:10px}
.empty .big{font-family:"Caveat","Noto Sans TC","PingFang TC","Microsoft JhengHei","微軟正黑體",sans-serif;font-size:28px;color:var(--orange-d)}
.overlay{position:fixed;inset:0;background:rgba(44,40,34,.5);z-index:40;opacity:0;visibility:hidden;transition:opacity .25s}.overlay.on{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:540px;margin:0 auto;background:var(--paper);border-radius:22px 22px 0 0;padding:24px 22px calc(28px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.8,.25,1);max-height:90vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet.on{transform:translateY(0)}.sheet .grab{width:46px;height:5px;background:#d8d0c2;border-radius:5px;margin:0 auto 16px}
.d-tags{display:flex;gap:6px;flex-wrap:wrap}
.sheet .d-tag{display:inline-block;font-size:12px;font-weight:700;color:var(--mtext);background:var(--mc);padding:4px 11px;border-radius:5px;transform:rotate(-1.5deg)}
.sheet .d-tag.alt{background:transparent;color:var(--mcd);border:2px solid var(--mc);transform:rotate(1.2deg)}
.sheet h2{font-weight:900;font-size:25px;margin:12px 0 4px;line-height:1.2}.sheet .d-loc{color:var(--ink-soft);font-size:14px;font-weight:500;margin-bottom:16px}.sheet .d-loc b{color:var(--mcd)}
.d-block{background:#fff;border-radius:12px;padding:13px 15px;margin-bottom:11px;border-left:5px solid var(--mc)}
.d-block .k{font-size:12px;color:var(--ink-soft);font-weight:700;letter-spacing:.5px;margin-bottom:4px}.d-block .v{font-size:15px;font-weight:500;line-height:1.65;white-space:pre-line}
.d-intro{font-size:13.5px;color:var(--ink-soft);line-height:1.85;margin:6px 2px 18px;white-space:pre-line}
.btns{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px}
.btn{flex:1 1 calc(50% - 5px);text-align:center;text-decoration:none;border:2.5px solid var(--ink);border-radius:30px;padding:12px 8px;font-weight:700;font-size:14.5px;color:var(--ink);background:var(--paper);transition:transform .1s}
.btn:active{transform:scale(.95)}.btn.fill{background:var(--mc);border-color:var(--mcd);color:var(--mtext)}.btn .e{margin-right:5px}
.foot{margin:36px 0 0;padding:26px 24px;border-radius:18px;background:var(--green-band);color:#fff;position:relative;overflow:hidden}
.foot .s-dia{top:16px;right:18px;width:42px;transform:rotate(8deg)}.foot .s-shaka{bottom:14px;right:20px;width:48px;transform:rotate(-6deg)}
.foot .logo-f{font-family:"Baloo 2";font-weight:800;font-size:17px;border:3px solid #fff;border-radius:10px;padding:3px 12px;display:inline-block;margin-bottom:6px;letter-spacing:.5px;position:relative;z-index:2}
.foot h3{margin:14px 0 8px;font-size:15px;font-weight:700;letter-spacing:.3px;position:relative;z-index:2}
.contact{margin-top:6px;font-size:13.5px;line-height:2.05;position:relative;z-index:2}
.contact a{color:#fff;text-decoration:none;font-weight:600;border-bottom:1px dotted rgba(255,255,255,.6);transition:color .15s,border-color .15s}
.contact a:hover{color:var(--orange);border-color:var(--orange)}.contact .lab{opacity:.85;font-weight:400;margin-right:6px}
.foot .east{margin-top:14px;font-size:12.5px;opacity:.92;position:relative;z-index:2}.foot .east a{color:#fff;transition:color .15s}.foot .east a:hover{color:var(--orange)}
.foot .malls{margin-top:14px;font-size:11.5px;opacity:.8;line-height:1.8;position:relative;z-index:2}
.fab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;background:rgba(251,249,242,.96);padding:10px 8px;border-radius:16px 0 0 16px;box-shadow:-5px 6px 18px rgba(60,50,30,.2);border:2px solid var(--green);border-right:none;transition:opacity .2s}
.fab a,.fab button{position:relative;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--green-band);color:#fff;border:none;cursor:pointer;transition:transform .16s,background .16s;padding:0}
.fab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2}
.fab a:hover,.fab button:hover{transform:scale(1.13);background:var(--orange)}
.fab [data-tip]::after{content:attr(data-tip);position:absolute;right:54px;top:50%;transform:translateY(-50%) scale(.9);transform-origin:right center;background:var(--ink);color:#fff;padding:6px 11px;border-radius:9px;font-size:12.5px;font-weight:700;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.fab [data-tip]:hover::after{opacity:1;transform:translateY(-50%) scale(1)}
body.sheet-open .fab{opacity:0;pointer-events:none}
@media(max-width:700px){.fab{gap:6px;padding:7px 5px}.fab a,.fab button{width:38px;height:38px}.fab svg{width:20px;height:20px}.fab [data-tip]::after{display:none}}
#toast{position:fixed;left:50%;bottom:42px;transform:translateX(-50%) translateY(18px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:30px;font-size:13.5px;font-weight:700;opacity:0;transition:.25s;z-index:80;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body>

 '臺東車站東站商場':{cls:'m-east',sub:'臺東新火車站站前廣場',addr:'臺東縣臺東市岩灣里岩灣路101巷598號'},

const POPCAT='POP-UP 快閃展';
const CATORDER=(()=>{const c={};DATA.forEach(s=>s.cats.forEach(k=>c[k]=(c[k]||0)+1));let ks=Object.keys(c).sort((a,b)=>c[b]-c[a]).filter(k=>k!==POPCAT);if(POPCAT in c)ks.unshift(POPCAT);return ks;})();
const NOINTRO=['','無','X','x','-','N/A','無形象照'];
let state={mall:'全部',cat:'全部',zone:'全部',floor:'全部',mz:'全部',q:''};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mcls=m=>(MALL_INFO[m]||{}).cls||'m-shude';const pad=n=>String(n).padStart(2,'0');const WDN=['日','一','二','三','四','五','六'];
const mzLabel=z=>z==='D區'?'D區（紅橘線轉換層）':z;
function fmt(min){return pad(Math.floor(min/60))+':'+pad(min%60);}
function locHTML(s){
  if(s.mall==='高雄駅一番街'&&s.st){const cls=s.st==='北站'?'st-n':'st-s';return ` <span class="st ${cls}">${s.st}${s.fl?' '+s.fl:''}</span>`;}
  if(s.mall==='美麗島墨凡商場'&&s.mz){return ` · <span class="loc2">${esc(mzLabel(s.mz))}</span>`;}
  return s.loc2?` · <span class="loc2">${esc(s.loc2)}</span>`:'';
}
function status(sch){
  if(!sch)return null;
  if(sch.mode==='24h')return{c:'b-open',t:'24h 營業中'};
  if(sch.mode==='appt')return{c:'b-appt',t:'採預約制'};
  if(sch.mode==='unknown')return null;
  const now=new Date(),d=now.getDay(),cur=now.getHours()*60+now.getMinutes();
  for(const s of(sch.days[d]||[]))if(cur>=s[0]&&cur<s[1])return{c:'b-open',t:'營業中'};
  for(let off=0;off<8;off++){const dd=(d+off)%7;for(const s of(sch.days[dd]||[])){if(off===0&&s[0]<=cur)continue;if(off===0)return{c:'b-soon',t:fmt(s[0])+' 開門'};if(off===1)return{c:'b-next',t:'明天 '+fmt(s[0])+' 開'};return{c:'b-next',t:'週'+WDN[dd]+' '+fmt(s[0])+' 開'};}}
  return null;
}
function availCats(){const base=DATA.filter(s=>state.mall==='全部'||s.mall===state.mall);const set=new Set();base.forEach(s=>s.cats.forEach(c=>set.add(c)));return['全部',...CATORDER.filter(c=>set.has(c))];}
function buildChips(){

  const cats=availCats();const base=DATA.filter(s=>state.mall==='全部'||s.mall===state.mall);const cc={};base.forEach(s=>s.cats.forEach(c=>cc[c]=(cc[c]||0)+1));
  document.getElementById('cats').innerHTML=cats.map(c=>{const n=c==='全部'?base.length:(cc[c]||0);const pop=c===POPCAT;const sel=state.cat===c;const cls=pop?('pop-chip'+(sel?' pop-on':'')):(sel?'on-cat':'');return `<button class="chip ${cls}" data-type="cat" data-v="${esc(c)}">${pop?'✦ ':''}${esc(c)}<span class="n">${n}</span></button>`;}).join('');
}
function buildZone(){
  const wrap=document.getElementById('zonewrap');

    const fb=eki.filter(s=>state.zone==='全部'||s.st===state.zone);

     <div class="chips">${zones.map(z=>`<button class="chip ${state.zone===z?'on-eki':''}" data-type="zone" data-v="${z}">${z}</button>`).join('')}</div>
     <div class="chips" style="margin-top:4px">${floors.map(f=>`<button class="chip ${state.floor===f?'on-eki':''}" data-type="floor" data-v="${f}">${f}</button>`).join('')}</div>`;
  } else if(state.mall==='美麗島墨凡商場'){
    wrap.style.setProperty('--mc-zone','#EC8E78');wrap.style.display='block';
    const ml=DATA.filter(s=>s.mall==='美麗島墨凡商場');

  } else {wrap.style.display='none';wrap.innerHTML='';}
}
function filtered(){const q=state.q.trim().toLowerCase();return DATA.filter(s=>{
  if(state.mall!=='全部'&&s.mall!==state.mall)return false;
  if(state.zone!=='全部'&&s.st!==state.zone)return false;
  if(state.floor!=='全部'&&s.fl!==state.floor)return false;
  if(state.mz!=='全部'&&s.mz!==state.mz)return false;
  if(state.cat!=='全部'&&!s.cats.includes(state.cat))return false;
  if(q&&!((s.name+' '+s.cats.join(' ')+' '+s.mall+' '+s.loc2+' '+s.intro).toLowerCase().includes(q)))return false;
  return true;});}
function render(){
  buildChips();buildZone();const list=filtered();
  document.getElementById('count').innerHTML=`找到 <b>${list.length}</b> 家品牌`;

  }).join('');
}
function openSheet(idx){

  const mapsQ=encodeURIComponent(addr?(info.sub+' '+addr):(s.mall+' '+(s.loc2||'')+' '+s.name));

  const showIntro=s.intro && !NOINTRO.includes(s.intro.trim());

    ${showIntro?`<p class="d-intro">${esc(s.intro)}</p>`:''}
    <div class="btns">${links}</div>`;
  document.getElementById('overlay').classList.add('on');sheet.classList.add('on');sheet.scrollTop=0;document.body.classList.add('sheet-open');
}
function closeSheet(){document.getElementById('overlay').classList.remove('on');document.getElementById('sheet').classList.remove('on');document.body.classList.remove('sheet-open');}
function sharePage(){const u=location.href;if(navigator.share){navigator.share({title:'墨凡商場 · 品牌情報站',url:u}).catch(()=>{});}else if(navigator.clipboard){navigator.clipboard.writeText(u).then(()=>toast('已複製本頁網址，貼給好友吧！')).catch(()=>toast(u));}else{toast(u);}}
function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}t.textContent=m;t.className='show';clearTimeout(t._h);t._h=setTimeout(()=>{t.className='';},2400);}
document.addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(chip){const tp=chip.dataset.type,v=chip.dataset.v;
    if(tp==='mall'){state.mall=v;if(v!=='高雄駅一番街'){state.zone='全部';state.floor='全部';}if(v!=='美麗島墨凡商場'){state.mz='全部';}if(!availCats().includes(state.cat))state.cat='全部';}
